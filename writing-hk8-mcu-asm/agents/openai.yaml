interface:
  display_name: "HK64S825 ASM 闭环"
  short_description: "生成或审查 HK64S825 ASM，经语义检查和内置编译模块通过后交付"
  default_prompt: "使用 $writing-hk8-mcu-asm 新写或审查 HK64S825 ASM。若请求已明确 HK64S825，只跳过芯片型号确认；芯片已知不代表开发板已知。识别 GPIO、LED、I2C、OLED 或数码管模块后，只读取对应 references/modules/<module>/defaults.json；模块默认值不能补齐任何板级事实。候选生成前必须由用户提供板级参数或明确选择 board profile，并记录 board/pins/clock 的 input_provenance；不得采用默认板、旧代码或示例补齐接线。推荐已注册 profile 时只枚举 references/boards 的一级目录名，并在问题中完整列出已有 board_profile_id；aliases.json 不列入推荐，多个 ID 时不得因用户只回复 A 而默认第一项。缺口未解决不创建 ASM 或 new-run。用户已明确选择带正常显示 E1 证据的 ready 数码管机器 profile，且请求为 MM:SS 倒计时时，直接用 generate_countdown.py 生成并只运行一次 quick-release，不预跑 doctor/lint，不展开 analysis、模板、通用规范或检查器源码。只使用芯片级资料和已确认板级契约，不扫盘找编译器。内置编译通过后交付中文注释 ASM。"
