interface:
  display_name: "HK64S825 ASM 闭环"
  short_description: "生成或审查 HK64S825 ASM，经语义检查和内置编译模块通过后交付"
  default_prompt: "使用 $writing-hk8-mcu-asm 新写或审查 HK64S825 ASM。若请求已明确 HK64S825，只跳过芯片型号确认；芯片已知不代表开发板已知。GPIO、OLED、数码管等任务必须在候选生成前由用户提供板级参数或明确选择 board profile，并记录 board/pins/clock 的 input_provenance；不得采用默认板、旧代码或示例补齐接线。未知板先分批询问，缺口未解决不创建 ASM 或 new-run。只使用芯片级资料和已确认板级契约，不扫盘找编译器。内置编译通过后交付中文注释 ASM。"
